version: '3.8'

services:
  # ── Core Infrastructure ──
  postgres:
    image: postgres:16-alpine
    container_name: fanaye-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fanaye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fanaye_secret}
      POSTGRES_DB: ${POSTGRES_DB:-fanaye_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fanaye} -d ${POSTGRES_DB:-fanaye_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fanaye-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Application Services (Full-Stack Profile) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fanaye-backend-api
    restart: unless-stopped
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-fanaye}:${POSTGRES_PASSWORD:-fanaye_secret}@postgres:5432/${POSTGRES_DB:-fanaye_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-fanaye_super_secure_enterprise_jwt_secret_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-fanaye_super_secure_enterprise_refresh_jwt_secret_2026}
    ports:
      - "4000:4000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fanaye-backend-worker
    restart: unless-stopped
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-fanaye}:${POSTGRES_PASSWORD:-fanaye_secret}@postgres:5432/${POSTGRES_DB:-fanaye_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: ["node", "dist/src/main-worker"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fanaye-frontend
    restart: unless-stopped
    profiles: ["app"]
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
